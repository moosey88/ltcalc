<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const GBP=v=>{if(v==null||isNaN(v))return'–';const s=Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});return(v<0?'−':'')+'£'+s};
const GBP2=v=>{if(v==null||isNaN(v))return'–';return(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5;
const U=(y,m,d)=>Date.UTC(y,m,d);
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return U(a,b-1,c)};
const iso=t=>new Date(t).toISOString().slice(0,10);
const ym=t=>iso(t).slice(0,7);
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=t=>{const d=new Date(t);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+(d.getUTCFullYear()!==new Date().getFullYear()?' '+String(d.getUTCFullYear()).slice(2):'')};
const fmonth=k=>{const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+String(y).slice(2)};
const uid=()=>Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ============ starting plan (from the Sept 26 tab of Finances.xlsx) ============ */
function defaultPlan(){return{
  v:1, asOf:todayISO(), bank:null, horizon:24, buffer:500, amexShare:0,
  income:[
    {id:'i_annie',name:'Annie wages',amount:8333,day:28},
    {id:'i_sander',name:'Sander wages (varies)',amount:1500,day:29}],
  bills:[
    {id:'b_mort',name:'Mortgage',amount:1818.69,day:2,card:false,fee:0},
    {id:'b_ctax',name:'Council tax',amount:260,day:2,card:false,fee:0},
    {id:'b_vet',name:'Vet cover',amount:20,day:2,card:false,fee:0,guess:1},
    {id:'b_phone',name:'Annie / girls phone',amount:77.94,day:2,card:false,fee:0},
    {id:'b_gym',name:'Sander and Erin gym',amount:67,day:2,card:false,fee:0,guess:1},
    {id:'b_water',name:'Water',amount:53,day:2,card:false,fee:0,guess:1},
    {id:'b_bb',name:'Broadband and TV',amount:9.1,day:2,card:false,fee:0,guess:1},
    {id:'b_netflix',name:'Netflix',amount:18.99,day:10,card:false,fee:0},
    {id:'b_phyl',name:'Phyliss',amount:8.68,day:10,card:false,fee:0,guess:1},
    {id:'b_prime',name:'Amazon Prime',amount:8.99,day:10,card:false,fee:0,guess:1},
    {id:'b_spot',name:'Spotify',amount:21.99,day:24,card:false,fee:0},
    {id:'b_gas',name:'Gas & electric',amount:282,day:21,card:false,fee:0}],
  debts:[
    {id:'d_tax',name:'Tax bill repayment',balance:null,apr:0,pay:1000,day:9},
    {id:'d_mbna',name:'MBNA loan (Annie car)',balance:null,apr:0,pay:0,day:1},
    {id:'d_ikea',name:'Ikea repayment',balance:null,apr:0,pay:0,day:1}],
  vars:[
    {id:'v_acash',name:'Annie Cash',budget:750,cardOK:false},
    {id:'v_scash',name:'Sander Cash',budget:500,cardOK:false},
    {id:'v_shop',name:'Shopping',budget:650,cardOK:true},
    {id:'v_round',name:'Roundups',budget:15,cardOK:false},
    {id:'v_gen',name:'General Merchandise',budget:200,cardOK:true},
    {id:'v_eat',name:'Takeout / Restaurants / Entertainment',budget:200,cardOK:true},
    {id:'v_home',name:'Home maintenance',budget:100,cardOK:true}],
  savings:{monthly:2000,day:1,general:9.54},
  goals:[
    {id:'g_xmas',name:'Christmas 2026',target:1500,saved:0,date:'2026-12-15',monthly:0,spend:true,example:1},
    {id:'g_hol',name:'Summer holiday 2027',target:4000,saved:0,date:'2027-07-15',monthly:0,spend:true,example:1}],
  oneoffs:[
    {id:'o_ex',name:'Example: car service and MOT',amount:600,date:addDays(todayISO(),45),pay:'bank',example:1}],
  amex:{closeDay:5,dueDays:25,rate:1,pv:1.2,owed:0,limit:null},
  mortgage:{balance:null,rate:null,overpay:0},
  rules:[
    {k:'TESCO',c:'v_shop'},{k:'SAINSBURY',c:'v_shop'},{k:'ASDA',c:'v_shop'},{k:'LIDL',c:'v_shop'},{k:'ALDI',c:'v_shop'},{k:'WAITROSE',c:'v_shop'},{k:'MORRISONS',c:'v_shop'},{k:'OCADO',c:'v_shop'},{k:'CO-OP',c:'v_shop'},
    {k:'ROUND UP',c:'v_round'},{k:'ROUNDUP',c:'v_round'},
    {k:'AMAZON',c:'v_gen'},{k:'ARGOS',c:'v_gen'},
    {k:'DELIVEROO',c:'v_eat'},{k:'JUST EAT',c:'v_eat'},{k:'UBER EATS',c:'v_eat'},{k:'COSTA',c:'v_eat'},{k:'STARBUCKS',c:'v_eat'},{k:'PRET',c:'v_eat'},{k:'NANDO',c:'v_eat'},{k:'MCDONALD',c:'v_eat'},{k:'CINEMA',c:'v_eat'},
    {k:'B&Q',c:'v_home'},{k:'SCREWFIX',c:'v_home'},{k:'WICKES',c:'v_home'},
    {k:'CASH',c:'v_acash'},{k:'ATM',c:'v_acash'}]
}}
function addDays(s,n){return iso(parseISO(s)+n*DAY)}

/* ============ forecast engine ============ */
function withScenario(plan,sc){
  if(!sc)return plan;
  const p=clone(plan);
  p.income.forEach(i=>{if(sc.inc[i.id]!=null)i.amount=sc.inc[i.id]});
  p.vars.forEach(v=>{if(sc.vars[v.id]!=null)v.budget=sc.vars[v.id]});
  p.savings.monthly=sc.sav; p.mortgage.overpay=sc.over; p.amexShare=sc.share; p.buffer=sc.buffer;
  return p;
}
function monthsBetween(a,b){const x=new Date(a),y=new Date(b);return(y.getUTCFullYear()-x.getUTCFullYear())*12+y.getUTCMonth()-x.getUTCMonth()}

function simulate(p){
  const start=parseISO(p.asOf)+DAY, end=U(new Date(start).getUTCFullYear(),new Date(start).getUTCMonth()+p.horizon,new Date(start).getUTCDate());
  const A=p.amex;
  let bank=p.bank||0, cycle=A.owed||0, stmts=[], owedStmts=0, cardSpendTotal=0, feeTotal=0;
  const pots={general:p.savings.general||0}; p.goals.forEach(g=>pots[g.id]=g.saved||0);
  const done={}; const hit={}; const goalSpend={};
  const dbal={}; p.debts.forEach(d=>dbal[d.id]=d.balance);
  // savings event dates
  const sdays=[]; {let d=start;while(d<=end){const dt=new Date(d);const dd=Math.min(p.savings.day,dim(dt.getUTCFullYear(),dt.getUTCMonth()));if(dt.getUTCDate()===dd)sdays.push(d);d+=DAY}}
  const days=[], months={}, events=[], statementsOut=[];
  let lowBank={v:1e12,t:0}, lowTrue={v:1e12,t:0};
  const mkey=t=>ym(t);
  for(let t=start;t<=end;t+=DAY){
    const dt=new Date(t),y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate(),n=dim(y,m);
    const M=months[mkey(t)]||(months[mkey(t)]={k:mkey(t),inc:0,bills:0,debt:0,vars:0,one:0,sav:0,over:0,feeN:0,cardSpend:0,amexPaid:0,goalOut:0});
    const onDay=day=>d===Math.min(day,n);
    const charge=(amt,card,fee)=>{ // returns nothing; handles bank vs amex
      if(card){cycle+=amt;cardSpendTotal+=amt;const f=amt*(fee||0)/100;if(f>0){bank-=f;feeTotal+=f;M.feeN+=f}}else bank-=amt};
    // income
    p.income.forEach(i=>{if(onDay(i.day)){bank+=i.amount;M.inc+=i.amount;events.push({t,k:'in',n:i.name,a:i.amount})}});
    // fixed bills
    p.bills.forEach(b=>{if(onDay(b.day)){charge(b.amount,b.card,b.fee);M.bills+=b.amount;if(b.id==='b_mort'||/mortgage/i.test(b.name)){if(p.mortgage.overpay>0){bank-=p.mortgage.overpay;M.over+=p.mortgage.overpay}}}});
    // debts
    p.debts.forEach(x=>{if(onDay(x.day)&&x.pay>0){let pay=x.pay;const b=dbal[x.id];
      if(b!=null){if(b<=0)return;const bal=b*(1+(x.apr||0)/1200);pay=Math.min(pay,bal);dbal[x.id]=bal-pay;if(dbal[x.id]<=0.005){dbal[x.id]=0;x.__end=x.__end||t}}
      bank-=pay;M.debt+=pay}});
    // variable spend, evenly each day
    const share=Math.min(1,Math.max(0,(p.amexShare||0)/100));
    p.vars.forEach(v=>{const a=v.budget/n;const cardPart=v.cardOK?a*share:0;if(cardPart>0){cycle+=cardPart;cardSpendTotal+=cardPart}bank-=a-cardPart;M.vars+=a});
    // one-offs
    p.oneoffs.forEach(o=>{if(o.date===iso(t)){M.one+=o.amount;events.push({t,k:'one',n:o.name,a:-o.amount,pay:o.pay});
      if(o.pay==='amex'){cycle+=o.amount;cardSpendTotal+=o.amount}
      else if(o.pay==='savings'){const take=Math.min(pots.general,o.amount);pots.general-=take;bank-=o.amount-take}
      else bank-=o.amount}});
    // savings transfer + goal allocation
    if(sdays.includes(t)){
      let avail=Math.min(p.savings.monthly,Math.max(0,bank)+0); avail=p.savings.monthly; bank-=avail; M.sav+=avail;
      const idx=sdays.indexOf(t);
      const live=p.goals.filter(g=>!done[g.id]).sort((a,b)=>a.date<b.date?-1:1);
      live.forEach(g=>{const gt=parseISO(g.date);let last=-1;sdays.forEach((s,i)=>{if(s<=gt)last=i});const left=Math.max(1,last-idx+1);
        const need=Math.max(0,g.target-pots[g.id]);let give=g.monthly>0?Math.min(g.monthly,need):Math.min(need/left,need);give=Math.min(give,avail);
        pots[g.id]+=give;avail-=give});
      pots.general+=avail;
    }
    // goals reached / spent on date
    p.goals.forEach(g=>{if(!hit[g.id]&&pots[g.id]>=g.target-0.005&&!done[g.id])hit[g.id]=t;
      if(!done[g.id]&&iso(t)===g.date){const sp=g.spend?Math.min(pots[g.id],g.target):0;if(g.spend){pots[g.id]-=sp;M.goalOut+=sp}goalSpend[g.id]={t,spent:sp,short:Math.max(0,g.target-sp)};done[g.id]=true;events.push({t,k:'goal',n:g.name,a:-sp,short:Math.max(0,g.target-sp)})}});
    // amex statement close + payment
    if(d===Math.min(A.closeDay,n)){if(cycle>0.005){const s={close:t,due:t+A.dueDays*DAY,amt:cycle};stmts.push(s);owedStmts+=cycle;statementsOut.push(s)}cycle=0}
    stmts.forEach(s=>{if(!s.paid&&s.due===t){bank-=s.amt;owedStmts-=s.amt;s.paid=true;M.amexPaid+=s.amt;events.push({t,k:'amex',n:'Amex statement due',a:-s.amt})}});
    const owed=cycle+owedStmts, tru=bank-owed, sav=Object.values(pots).reduce((a,b)=>a+b,0);
    if(bank<lowBank.v)lowBank={v:bank,t};if(tru<lowTrue.v)lowTrue={v:tru,t};
    days.push({t,bank,owed,tru,sav});
    M.endBank=bank;M.endTrue=tru;M.endSav=sav;M.endOwed=owed;
  }
  const goals=p.goals.map(g=>{const ht=hit[g.id];const gs=goalSpend[g.id];const dl=parseISO(g.date);
    let status='ok';if(gs&&gs.short>1)status='late';else if(ht&&ht>dl)status='late';else if(!ht&&!gs)status='beyond';
    return{...g,hit:ht,gs,status,pot:pots[g.id]}});
  // Amex verdict
  let verdict='good',why='Every statement is covered by cash you will hold on the due date.';
  if(cardSpendTotal>0||(A.owed||0)>0){
    if(lowBank.v<0){verdict='bad';why='The bank balance drops below zero on '+fdate(lowBank.t)+'. A card payment could not be made in full.'}
    else if(lowTrue.v<p.buffer){verdict='warn';why='After setting aside what you owe Amex, cash falls to '+GBP(lowTrue.v)+' on '+fdate(lowTrue.t)+', below your '+GBP(p.buffer)+' buffer.'}
  } else {verdict='none';why='No spend is on the card in this plan.'}
  const float=cardSpendTotal>0?(()=>{const cl=A.closeDay;return Math.round(30.4/2+A.dueDays)})():0;
  const nMonths=Math.max(1,monthsBetween(start,end));
  return{days,months:Object.values(months),events,goals,pots,lowBank,lowTrue,stmts:statementsOut,verdict,why,cardSpendTotal,feeTotal,float,dbal,start,end,nMonths,
    debtEnd:p.debts.map(d=>({id:d.id,name:d.name,end:d.__end||null}))}
}
function mortgageCalc(p,over){
  const m=p.mortgage,b=p.bills.find(x=>x.id==='b_mort');if(!m.balance||m.rate==null||!b)return null;
  const r=m.rate/1200,pay=b.amount;const run=ex=>{let bal=m.balance,i=0,int=0;while(bal>0&&i<1200){const it=bal*r;if(pay+ex<=it)return null;int+=it;bal=bal+it-pay-ex;i++}return{n:i,int}};
  return{base:run(0),over:run(over)}
}

/* ============ charts ============ */
function lineChart(id,days,opt){
  const W=760,H=240,L=54,R=12,T=12,B=26;const n=days.length;if(!n)return'';
  const series=opt.series;let lo=Math.min(0,opt.buffer!=null?Math.min(opt.buffer,0):0),hi=-1e12;
  series.forEach(s=>days.forEach(d=>{const v=d[s.k];if(v<lo)lo=v;if(v>hi)hi=v}));
  if(opt.buffer!=null&&opt.buffer>hi)hi=opt.buffer; hi=Math.max(hi,100);
  const pad=(hi-lo)*.06;lo-=pad;hi+=pad;
  const x=i=>L+(W-L-R)*i/Math.max(1,n-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const nice=(()=>{const span=hi-lo,raw=span/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,st=(f<1.5?1:f<3?2:f<7?5:10)*mag;const a=[];for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)a.push(v);return a})();
  let g='';nice.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${GBP(v)}</text>`);
  // x labels: month starts
  let xl='';let last='';days.forEach((d,i)=>{const k=ym(d.t);if(k!==last){last=k;if(i%Math.max(1,Math.round(n/9))<31||i===0){const dt=new Date(d.t);if(dt.getUTCDate()<=3||i===0)xl+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${MON[dt.getUTCMonth()]}</text>`}}});
  let paths=series.map(s=>{let d='';days.forEach((p,i)=>d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(p[s.k]).toFixed(1));return`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`}).join('');
  let buf=opt.buffer!=null?`<line x1="${L}" x2="${W-R}" y1="${y(opt.buffer)}" y2="${y(opt.buffer)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 4"/><text x="${W-R}" y="${y(opt.buffer)-4}" text-anchor="end" style="fill:var(--warn)">buffer ${GBP(opt.buffer)}</text>`:'';
  // marks for lows
  let marks='';(opt.marks||[]).forEach(mk=>{const i=days.findIndex(d=>d.t===mk.t);if(i<0)return;marks+=`<circle cx="${x(i)}" cy="${y(mk.v)}" r="5" fill="${mk.c}" stroke="var(--surface)" stroke-width="2"/>`});
  const html=`<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label)}">${g}${xl}${buf}${paths}${marks}<line class="xh" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>`;
  setTimeout(()=>{const el=document.getElementById(id);if(!el)return;const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
    const mv=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;let i=Math.round((px-L)/(W-L-R)*(n-1));i=Math.max(0,Math.min(n-1,i));const d=days[i];
      xh.style.display='';xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));tip.style.display='block';
      tip.innerHTML='<b>'+fdate(d.t)+'</b><br>'+series.map(s=>s.name+': '+GBP(d[s.k])).join('<br>');
      const tx=x(i)/W*r.width;tip.style.left=Math.min(Math.max(0,tx+10),r.width-150)+'px';tip.style.top='6px'};
    svg.addEventListener('pointermove',mv);svg.addEventListener('pointerleave',()=>{tip.style.display='none';xh.style.display='none'})},0);
  return html;
}
function barChart(months){
  const W=760,H=220,L=54,R=8,T=10,B=26;const mx=Math.max(...months.map(m=>Math.max(m.inc,m.out)),1)*1.08;
  const y=v=>T+(H-T-B)*(1-v/mx);const bw=(W-L-R)/months.length;
  let g='';const st=Math.pow(10,Math.floor(Math.log10(mx)))*(mx/Math.pow(10,Math.floor(Math.log10(mx)))>5?2:1);
  for(let v=0;v<=mx;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${GBP(v)}</text>`;
  let b='';months.forEach((m,i)=>{const x0=L+i*bw+bw*.14,w=bw*.34;
    b+=`<g><title>${fmonth(m.k)}: in ${GBP(m.inc)}, out ${GBP(m.out)}</title><rect x="${x0}" y="${y(m.inc)}" width="${w}" height="${y(0)-y(m.inc)}" rx="3" fill="var(--bank)"/><rect x="${x0+w+2}" y="${y(m.out)}" width="${w}" height="${y(0)-y(m.out)}" rx="3" fill="var(--amex)"/><text x="${L+i*bw+bw/2}" y="${H-7}" text-anchor="middle">${MON[+m.k.slice(5)-1]}</text></g>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Money in and out each month">${g}${b}</svg><div class="legend"><span><i style="border-color:var(--bank)"></i>Money in</span><span><i style="border-color:var(--amex)"></i>Money out (bills, spend, savings, one-offs)</span></div>`;
}

/* --- import --- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true; else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  if(cur||row.length){row.push(cur);if(row.some(x=>x.trim()))rows.push(row)}
  return rows;
}
function toISO(s){s=s.trim().replace(/^'/,'');let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2}) (\w{3})\w* (\d{4})$/);if(m){const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mo>=0)return m[3]+'-'+String(mo+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}return null}
function num(s){const v=parseFloat(String(s).replace(/[£,\s]/g,''));return isNaN(v)?null:v}
function categorise(desc){const D=desc.toUpperCase();const r=plan.rules.find(r=>D.includes(r.k.toUpperCase()));return r?r.c:''}
async function importFile(file,src){
  const text=await file.text();const rows=parseCSV(text);if(rows.length<2)return'That file has no rows.';
  const H=rows[0].map(h=>h.trim().toLowerCase());const col=n=>H.findIndex(h=>h===n||h.includes(n));
  const iD=col('date'),iDesc=H.findIndex(h=>h==='description'||h.includes('descr')),iV=H.findIndex(h=>h==='value'||h==='amount'),iB=H.findIndex(h=>h==='balance');
  if(iD<0||iDesc<0||iV<0)return'Could not find Date, Description and Value/Amount columns. Is this a NatWest or Amex CSV?';
  const byM={};const seen={};let added=0,skipped=0,lastBal=null,lastDate='';
  const parsed=[];
  rows.slice(1).forEach(r=>{const d=toISO(r[iD]||'');let a=num(r[iV]);if(!d||a==null)return;if(src==='amex')a=-a;const b=iB>=0?num(r[iB]):null;parsed.push({d,t:(r[iDesc]||'').trim().replace(/\s+/g,' '),a,b})});
  if(!parsed.length)return'No valid rows found.';
  parsed.forEach(x=>{const key=x.d+'|'+x.t+'|'+x.a+'|'+x.b;seen[key]=(seen[key]||0)+1;x.id=key+'#'+seen[key];const k=x.d.slice(0,7);(byM[k]=byM[k]||[]).push(x)});
  for(const k of Object.keys(byM)){const ex=(txMonths[k]||[]).filter(t=>t.s===src);const have=new Set(ex.map(t=>t.id));const others=(txMonths[k]||[]).filter(t=>t.s!==src);
    const add=byM[k].filter(x=>!have.has(x.id)).map(x=>({id:x.id,d:x.d,t:x.t,a:x.a,b:x.b,c:categorise(x.t),s:src}));skipped+=byM[k].length-add.length;added+=add.length;
    txMonths[k]=[...others,...ex,...add];await saveTx(k)}
  if(src==='nw'){const withB=parsed.filter(x=>x.b!=null).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);if(withB.length){const L=withB[withB.length-1];const ordered=parsed.filter(x=>x.d===L.d&&x.b!=null);
      // NatWest lists newest first; the first row for the latest date is the closing balance
      const first=parsed.find(x=>x.d===L.d&&x.b!=null);mutate(p=>{p.bank=first.b;p.asOf=L.d});return`Added ${added} new transactions (${skipped} already imported). Balance set to ${GBP2(first.b)} as of ${fdate(parseISO(L.d))}.`}}
  render();return`Added ${added} new transactions (${skipped} already imported).`;
}
async function saveTx(k){if(!dbh)return;try{await dbh.doc('tx/'+k).set({json:JSON.stringify(txMonths[k]),at:Date.now()})}catch(e){setSync('Transactions not synced ('+(e&&e.code||'error')+')','bad')}}
function vImport(){
  const k=ym(parseISO(plan.asOf));const tx=(txMonths[k]||[]).filter(t=>t.s);const spend=tx.filter(t=>t.a<0);
  const by={};plan.vars.forEach(v=>by[v.id]=0);let unc=[];spend.forEach(t=>{if(t.c&&by[t.c]!=null)by[t.c]+=-t.a;else if(!t.c)unc.push(t)});
  const dom=new Date(parseISO(plan.asOf)).getUTCDate(),n=dim(+k.slice(0,4),+k.slice(5)-1);
  const rows=plan.vars.map(v=>{const a=by[v.id],pace=v.budget*dom/n,pct=v.budget?a/v.budget*100:0;return`<tr><td>${esc(v.name)}</td><td class="n">${GBP(a)}</td><td class="n">${GBP(v.budget)}</td><td class="n ${a>v.budget?'neg':''}">${GBP(v.budget-a)}</td><td style="min-width:110px"><div class="bar"><i class="${a>v.budget?'r':a>pace*1.1?'w':'g'}" style="width:${Math.min(100,pct)}%"></i></div></td></tr>`}).join('');
  const catOpts=`<option value="">Choose…</option>`+plan.vars.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')+'<option value="_skip">Not a budget item (bill, transfer)</option>';
  const unTbl=unc.slice(0,25).map((t,i)=>`<tr><td>${fdate(parseISO(t.d))}</td><td>${esc(t.t)}</td><td class="n">${GBP2(-t.a)}</td><td><select data-cat="${esc(t.id)}" data-m="${k}">${catOpts}</select></td></tr>`).join('');
  return banners()+`<div class="grid">
   <div class="panel c12"><h2>Upload statements</h2>
    <div class="fileBox"><p style="margin-top:0">Download the CSV from NatWest online banking (Statements, then Export) or from Amex, then choose it here. Importing again is safe: repeats are skipped.</p>
    <div class="row" style="justify-content:center"><select id="impSrc"><option value="nw">NatWest current account</option><option value="amex">Amex card</option></select><input type="file" id="impFile" accept=".csv,text/csv"></div><p id="impMsg" class="small" style="margin-bottom:0"></p></div>
    <p class="small muted">The account number column is ignored and never stored. NatWest's latest balance becomes your opening bank balance.</p></div>
   <div class="panel c12"><h2>${MON[+k.slice(5)-1]} so far against budget</h2>
    ${tx.length?`<div class="tblwrap"><table><thead><tr><th>Category</th><th class="n">Spent</th><th class="n">Budget</th><th class="n">Left</th><th>Progress</th></tr></thead><tbody>${rows}</tbody></table></div>
     <p class="small muted">${spend.length-unc.length} of ${spend.length} payments matched a category. Bills and transfers that match no rule are listed below, and you can mark them as not a budget item.</p>`:'<p class="muted">Nothing imported for this month yet.</p>'}</div>
   ${unc.length?`<div class="panel c12"><h2>Needs a category (${unc.length})</h2><div class="tblwrap"><table><thead><tr><th>Date</th><th>Description</th><th class="n">£</th><th>Category</th></tr></thead><tbody>${unTbl}</tbody></table></div><p class="small muted">Choosing a category remembers it for similar payments in future.</p></div>`:''}
   </div>`;
}

/* ============ render + events ============ */
const TABS=[['overview','Overview',vOverview],['scenarios','Scenarios',vScenarios],['annual','Year ahead',vAnnual],['bills','Bills and debts',vBills],['savings','Savings',vSavings],['amex','Amex',vAmex],['import','Statements',vImport]];
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('');
  const t=TABS.find(x=>x[0]===tab);$('#main').innerHTML=t[2]();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.go){tab=b.dataset.go;render();return}
  const a=b.dataset.act;if(!a)return;
  if(a==='win'){view.win=+b.dataset.w;render()}
  if(a==='setbal'){const v=parseFloat($('#quickBal').value);if(!isNaN(v))mutate(p=>{p.bank=v;p.asOf=todayISO()})}
  if(a==='reset'){scenarioInit();render()}
  if(a==='commit'){mutate(p=>{p.income.forEach(i=>i.amount=sc.inc[i.id]);p.vars.forEach(v=>v.budget=sc.vars[v.id]);p.savings.monthly=sc.sav;p.mortgage.overpay=sc.over;p.amexShare=sc.share;p.buffer=sc.buffer});tab='overview';render()}
  if(a==='del'){mutate(p=>p[b.dataset.list].splice(+b.dataset.i,1))}
  if(a==='add'){const l=b.dataset.list;mutate(p=>{const id=l[0]+'_'+uid();
    if(l==='income')p.income.push({id,name:'New income',amount:0,day:28});
    if(l==='bills')p.bills.push({id,name:'New bill',amount:0,day:1,card:false,fee:0});
    if(l==='debts')p.debts.push({id,name:'New debt',balance:null,apr:0,pay:0,day:1});
    if(l==='vars')p.vars.push({id,name:'New category',budget:0,cardOK:true});
    if(l==='oneoffs')p.oneoffs.push({id,name:'New expense',amount:0,date:addDays(todayISO(),30),pay:'bank'});
    if(l==='goals')p.goals.push({id,name:'New goal',target:1000,saved:0,date:addDays(todayISO(),180),monthly:0,spend:true})})}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.p){let v;const t=el.dataset.t;if(t==='bool')v=el.checked;else if(t==='num')v=el.value===''?null:parseFloat(el.value);else v=el.value;
    if(t==='num'&&v==null&&/(amount|budget|target|pay|saved|day|apr|fee|monthly|general|overpay|rate|owed|closeDay|dueDays|pv|buffer)$/.test(el.dataset.p)&&!/balance|rate$/.test(el.dataset.p))v=0;
    mutate(p=>setPath(el.dataset.p,v));return}
  if(el.dataset.cat){const m=el.dataset.m,id=el.dataset.cat,c=el.value;if(!c)return;const t=(txMonths[m]||[]).find(x=>x.id===id);if(!t)return;
    const kw=t.t.toUpperCase().split(' ').filter(w=>w.length>2&&!/^\d+$/.test(w)).slice(0,2).join(' ');
    (txMonths[m]).forEach(x=>{if(!x.c&&x.t.toUpperCase().includes(kw)&&kw)x.c=c});t.c=c;
    if(c!=='_skip'&&kw&&!plan.rules.find(r=>r.k===kw))plan.rules.push({k:kw,c});else if(c==='_skip'&&kw&&!plan.rules.find(r=>r.k===kw))plan.rules.push({k:kw,c});
    persist();await saveTx(m);render();return}
  if(el.id==='impFile'&&el.files[0]){$('#impMsg').textContent='Reading…';try{const msg=await importFile(el.files[0],$('#impSrc').value);const m=$('#impMsg');if(m)m.textContent=msg}catch(err){const m=$('#impMsg');if(m)m.textContent='Could not read that file: '+err.message}}
});
document.addEventListener('input',e=>{
  const el=e.target;const id=el.dataset.sl;if(!id)return;const v=+el.value;
  if(id.startsWith('inc_'))sc.inc[id.slice(4)]=v;else if(id.startsWith('var_'))sc.vars[id.slice(4)]=v;else if(id==='share')sc.share=v;else sc[id]=v;
  const o=$('#o_'+id);if(o)o.textContent=id==='share'?v+'%':GBP(v);
  cancelAnimationFrame(view.raf);view.raf=requestAnimationFrame(()=>{const r=$('#scRes');if(r)r.innerHTML=scResults()});
});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});

/* ============ boot ============ */
render();
(async function(){
  const localLoaded=loadLocal();if(localLoaded){render();setSync('Loaded from this device','')}
  let db=null,user=null;
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  if(!db){setSync('Saved on this device only','bad');return}
  dbh=db;try{me=user&&await user.id();$('#who').textContent=''}catch(e){}
  try{const can=user&&await user.can('data.write');canWrite=can!==false}catch(e){}
  db.doc('hh/plan').onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();if(d.at&&d.at===lastAt){setSync('Saved · shared with Annie','ok');return}
      try{const o=JSON.parse(d.json);if(o&&o.v===1){plan=o;sc=null;saveLocal();if(!document.activeElement||!/INPUT|SELECT/.test(document.activeElement.tagName)||document.activeElement.type==='range')render();setSync('Synced with Annie','ok')}}catch(e){}}
    else{setSync('Ready. Your first change will be saved and shared','ok');if(localLoaded)persist()}
  },err=>setSync('Not synced ('+(err&&err.code||'error')+')','bad'));
  db.collection('tx').onSnapshot(snap=>{snap.docs.forEach(d=>{try{txMonths[d.id]=JSON.parse(d.data().json)}catch(e){}});if(tab==='import')render()},()=>{});
})();
</script>
