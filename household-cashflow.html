<style>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const GBP=v=>{if(v==null||isNaN(v))return'–';const s=Math.abs(v).toLocaleString('en-GB',{maximumFractionDigits:0});return(v<-0.5?'−':'')+'£'+s};
const GBP2=v=>{if(v==null||isNaN(v))return'–';return(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5, U=(y,m,d)=>Date.UTC(y,m,d);
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return U(a,b-1,c)};
const iso=t=>new Date(t).toISOString().slice(0,10);
const ym=t=>iso(t).slice(0,7);
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=t=>{if(t==null)return'–';const d=new Date(t);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2)};
const fmonthT=t=>{const d=new Date(t);return MON[d.getUTCMonth()]+' '+d.getUTCFullYear()};
const fmonth=k=>{const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+String(y).slice(2)};
const fmonthLong=k=>{const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+y};
const uid=()=>Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>iso(parseISO(s)+n*DAY);
const clone=o=>JSON.parse(JSON.stringify(o));
const monthsBetween=(a,b)=>{const x=new Date(a),y=new Date(b);return(y.getUTCFullYear()-x.getUTCFullYear())*12+y.getUTCMonth()-x.getUTCMonth()};
const addMonthsT=(t,n)=>{const d=new Date(t);return U(d.getUTCFullYear(),d.getUTCMonth()+n,1)};
const ys=n=>n==null?'never at this payment':((Math.floor(n/12)?Math.floor(n/12)+' yr ':'')+(n%12?n%12+' mo':'')).trim()||'0 mo';
const KIND={need:['Need','var(--need)'],want:['Want','var(--want)'],debt:['Debt','var(--debt)'],save:['Saving','var(--save)']};

/* ============ starting plan (figures from the Sept 26 tab of Finances.xlsx) ============ */
function defaultPlan(){return{
  v:2, asOf:todayISO(), bank:null, horizon:24, buffer:500, amexShare:0,
  income:[{id:'i_annie',name:'Annie wages',amount:8333,day:28},{id:'i_sander',name:'Sander wages (varies)',amount:1500,day:29}],

    {id:'b_water',name:'Water',amount:53,day:2,kind:'need',card:false,fee:0,guess:1},
    {id:'b_bb',name:'Broadband and TV',amount:9.1,day:2,kind:'need',card:false,fee:0,guess:1},
    {id:'b_phone',name:'Annie / girls phone',amount:77.94,day:2,kind:'need',card:false,fee:0},
    {id:'b_vet',name:'Vet cover',amount:20,day:2,kind:'need',card:false,fee:0,guess:1},

    {id:'b_netflix',name:'Netflix',amount:18.99,day:10,kind:'want',card:false,fee:0},

  debts:[
    {id:'d_mort',name:'Mortgage',type:'mortgage',balance:null,start:null,apr:null,pay:1818.69,day:2,extra:0},

  debtLog:{}, lumps:[], hist:[],

    {k:'ROUND UP',c:'v_round'},{k:'ROUNDUP',c:'v_round'},{k:'AMAZON',c:'v_gen'},{k:'ARGOS',c:'v_gen'},

/* ============ forecast engine (daily) ============ */
function buildGoals(p){
  return[...p.tax.map(t=>({id:t.id,name:t.name,kind:'tax',target:(t.last||0)*((t.adj??100)/100),saved:t.saved||0,date:t.date,monthly:0,spend:true,amex:false,pri:0})),
         ...p.goals.map(g=>({...g,kind:g.kind||'other',pri:1}))];
}
function simulate(p){
  const s0=parseISO(p.asOf)+DAY, sd=new Date(s0), end=U(sd.getUTCFullYear(),sd.getUTCMonth()+p.horizon,sd.getUTCDate()), start=s0;
  const A=p.amex, G=buildGoals(p);
  let bank=p.bank||0, cycle=A.owed||0, cardSpend=0, feeTotal=0; const stmts=[];
  const pots={general:p.savings.general||0}; G.forEach(g=>pots[g.id]=g.saved||0);
  const done={},hit={},gsp={},dbal={}; p.debts.forEach(d=>dbal[d.id]=d.balance);
  const sdays=[];for(let d=start;d<=end;d+=DAY){const dt=new Date(d);if(dt.getUTCDate()===Math.min(p.savings.day,dim(dt.getUTCFullYear(),dt.getUTCMonth())))sdays.push(d)}
  const sset=new Set(sdays);
  const days=[],months={},events=[];let lowBank={v:1e12,t:0},lowTrue={v:1e12,t:0};
  for(let t=start;t<=end;t+=DAY){
    const dt=new Date(t),y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate(),n=dim(y,m),k=ym(t),ds=iso(t);
    const M=months[k]||(months[k]={k,inc:0,bills:0,debt:0,lump:0,vars:0,one:0,sav:0,fee:0,goalOut:0});
    const on=day=>d===Math.min(day,n);
    p.income.forEach(i=>{if(on(i.day)){bank+=i.amount;M.inc+=i.amount;events.push({t,k:'in',n:i.name,a:i.amount})}});
    p.bills.forEach(b=>{if(on(b.day)){if(b.card){cycle+=b.amount;cardSpend+=b.amount;const f=b.amount*(b.fee||0)/100;bank-=f;feeTotal+=f;M.fee+=f}else bank-=b.amount;M.bills+=b.amount;events.push({t,k:'bill',n:b.name,a:-b.amount})}});
    p.debts.forEach(x=>{const tot=(x.pay||0)+(x.extra||0);if(!on(x.day)||tot<=0)return;let pay=tot;const b=dbal[x.id];
      if(b!=null){if(b<=0.005)return;const it=b*(x.apr||0)/1200,owe=b+it;pay=Math.min(tot,owe);dbal[x.id]=owe-pay;if(dbal[x.id]<=0.005)dbal[x.id]=0}
      bank-=pay;M.debt+=pay;events.push({t,k:'debt',n:x.name,a:-pay})});
    (p.lumps||[]).forEach(l=>{if(l.date!==ds)return;const d0=p.debts.find(x=>x.id===l.debt);let amt=l.amount;const b=dbal[l.debt];if(b!=null)amt=Math.min(amt,b);if(amt<=0)return;
      if(b!=null)dbal[l.debt]=Math.max(0,b-amt);
      if(l.from==='savings'){const take=Math.min(pots.general,amt);pots.general-=take;bank-=amt-take}else bank-=amt;
      M.lump+=amt;events.push({t,k:'lump',n:'Lump sum: '+(d0?d0.name:''),a:-amt})});
    const share=Math.min(1,Math.max(0,(p.amexShare||0)/100));
    p.vars.forEach(v=>{const a=v.budget/n,cp=v.cardOK?a*share:0;cycle+=cp;cardSpend+=cp;bank-=a-cp;M.vars+=a});
    p.oneoffs.forEach(o=>{if(o.date!==ds)return;M.one+=o.amount;events.push({t,k:'one',n:o.name,a:-o.amount,pay:o.pay});
      if(o.pay==='amex'){cycle+=o.amount;cardSpend+=o.amount}else if(o.pay==='savings'){const tk=Math.min(pots.general,o.amount);pots.general-=tk;bank-=o.amount-tk}else bank-=o.amount});
    if(sset.has(t)){let avail=p.savings.monthly;bank-=avail;M.sav+=avail;events.push({t,k:'save',n:'Transfer to savings',a:-avail});const idx=sdays.indexOf(t);

function parseCSV(text){const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}
  if(cur||row.length){row.push(cur);if(row.some(x=>x.trim()))rows.push(row)}return rows}
function toISO(s){s=s.trim().replace(/^'/,'');let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2}) (\w{3})\w* (\d{4})$/);if(m){const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mo>=0)return m[3]+'-'+String(mo+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}return null}
const num=s=>{const v=parseFloat(String(s).replace(/[£,\s]/g,''));return isNaN(v)?null:v};
async function saveTx(k){if(!dbh)return;try{await dbh.doc('tx/'+k).set({json:JSON.stringify(txMonths[k]),at:Date.now()})}catch(e){setSync('Transactions not synced ('+(e&&e.code||'error')+')','bad')}}
async function importFile(file,src){
  const rows=parseCSV(await file.text());if(rows.length<2)return'That file has no rows.';
  const H=rows[0].map(h=>h.trim().toLowerCase()),iD=H.findIndex(h=>h.includes('date')),iDesc=H.findIndex(h=>h==='description'||h.includes('descr')),iV=H.findIndex(h=>h==='value'||h==='amount'),iB=H.findIndex(h=>h==='balance');
  if(iD<0||iDesc<0||iV<0)return'Could not find Date, Description and Value/Amount columns. Is this a NatWest or Amex CSV?';
  const parsed=[];rows.slice(1).forEach(r=>{const d=toISO(r[iD]||'');let a=num(r[iV]);if(!d||a==null)return;if(src==='amex')a=-a;parsed.push({d,t:(r[iDesc]||'').trim().replace(/\s+/g,' '),a,b:iB>=0?num(r[iB]):null})});
  if(!parsed.length)return'No valid rows found.';
  const seen={},byM={};parsed.forEach(x=>{const key=x.d+'|'+x.t+'|'+x.a+'|'+x.b;seen[key]=(seen[key]||0)+1;x.id=key+'#'+seen[key];(byM[x.d.slice(0,7)]=byM[x.d.slice(0,7)]||[]).push(x)});
  let added=0,skipped=0;
  for(const k of Object.keys(byM)){let all=txMonths[k]||[];const have=new Set(all.filter(t=>t.s===src).map(t=>t.id));
    for(const x of byM[k]){if(have.has(x.id)){skipped++;continue}
      const mi=all.findIndex(t=>t.s==='man'&&t.p===(src==='amex'?'amex':'bank')&&t.d===x.d&&Math.abs(t.a-x.a)<0.005);let c=categorise(x.t);
      if(mi>=0){c=all[mi].c||c;all=all.filter((_,i)=>i!==mi)}
      all.push({id:x.id,d:x.d,t:x.t,a:x.a,b:x.b,c,s:src});added++}
    txMonths[k]=all;await saveTx(k)}
  if(src==='nw'){const withB=parsed.filter(x=>x.b!=null);
    if(withB.length){const ld=withB.map(x=>x.d).sort().pop(),firstOfDay=parsed.find(x=>x.d===ld&&x.b!=null);mutate(p=>{p.bank=firstOfDay.b;p.asOf=ld});return`Added ${added} new entries (${skipped} already there). Balance set to ${GBP2(firstOfDay.b)} as of ${fdate(parseISO(ld))}.`}}
  render();return`Added ${added} new entries (${skipped} already there).`}

function monthlyLines(S){

  const tax=plan.tax.map(t=>slider('tax_'+t.id,esc(t.name)+': share of last year',sc.tax[t.id],0,200,5,'',pct)).join('');
  const dopt=plan.debts.map(d=>`<option value="${d.id}" ${sc.debtSel===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
  return banners()+intro('Try changes without touching your real plan. Move a slider and the results update. Press Make this my plan only when you want to keep it.')+`<div class="grid">
   <div class="panel c4"><div class="lbl" style="margin-bottom:10px">Income per month</div>${inc}
    <div class="lbl" style="margin:14px 0 10px">Spending budgets per month</div>${vars}

    <div class="lbl" style="margin:14px 0 10px">Savings and card</div>
    ${slider('sav','Monthly savings transfer',sc.sav,0,5000,50)}
    ${slider('share','Share of card-friendly spend put on Amex',sc.share,0,100,5,'Shopping, general, eating out and home maintenance.',pct)}
    ${slider('buffer','Safety buffer to keep in the bank',sc.buffer,0,3000,50)}
    <div class="lbl" style="margin:14px 0 10px">Pay a debt down faster</div>
    <div class="sl"><label for="debtSel">Which debt</label><span></span><select id="debtSel" data-sl="debtSel" style="grid-column:1/-1">${dopt}</select></div>
    ${slider('extra','Extra each month',sc.extra,0,3000,25,`On top of the normal payment. Check your lender's yearly overpayment limit.`)}
    ${slider('lump','One-off lump sum',sc.lump,0,150000,500)}
    <div class="sl"><label for="lumpDate">Lump sum date</label><span></span><input type="date" id="lumpDate" data-sl="lumpDate" value="${sc.lumpDate}" style="grid-column:1/-1"></div>
    <div class="sl"><label for="lumpFrom">Paid from</label><span></span><select id="lumpFrom" data-sl="lumpFrom" style="grid-column:1/-1"><option value="savings" ${sc.lumpFrom==='savings'?'selected':''}>Savings first, then bank</option><option value="bank" ${sc.lumpFrom==='bank'?'selected':''}>Bank</option></select></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="commit">Make this my plan</button><button class="btn ghost" data-act="reset">Reset</button></div></div>
   <div class="panel c8" id="scRes">${scResults()}</div></div>`}
function scResults(){
  const P=sim(plan),X=sim(withScenario(plan,sc)),fm=S=>S.months.find(m=>m.k>ym(S.start-DAY))||S.months[0];
  const net=m=>m.inc-m.bills-m.debt-m.lump-m.vars-m.one-m.sav,at=(S,i)=>S.days[Math.min(i,S.days.length-1)];
  const row=(l,a,b,f=GBP,up=true)=>{const d=b-a,c=Math.abs(d)<0.5?'muted':(d>0)===up?'pos':'neg';return`<div>${l}</div><div class="n">${f(a)}</div><div class="n">${f(b)}</div><div class="n ${c}">${Math.abs(d)<0.5?'–':(d>0?'+':'−')+f(Math.abs(d))}</div>`};
  const d=plan.debts.find(x=>x.id===sc.debtSel);let debtHtml='';
  if(d&&(sc.extra>0||sc.lump>0)){
    const lm=Math.max(0,monthsBetween(parseISO(plan.asOf),parseISO(sc.lumpDate)));
    const a0=amort(d,0,0,-1),a1=amort(d,sc.extra,sc.lump,lm);
    if(a0&&a1&&a0.n!=null&&a1.n!=null){
      const N=Math.min(480,Math.max(a0.n,a1.n)+2),ser=[],t0=addMonthsT(parseISO(plan.asOf),0);
      for(let i=0;i<=N;i++)ser.push({t:addMonthsT(t0,i),p:a0.ser[i]??0,s:a1.ser[i]??0});
      debtHtml=`<h3 style="margin:16px 0 6px">${esc(d.name)}: what the extra does</h3>
       <div class="kpis" style="margin-bottom:8px"><div class="kpi"><span>Debt free</span><b style="font-size:1.25rem">${fmonthT(addMonthsT(parseISO(plan.asOf),a1.n))}</b><small>${ys(a0.n-a1.n)} sooner than ${fmonthT(addMonthsT(parseISO(plan.asOf),a0.n))}</small></div>
       <div class="kpi"><span>Interest saved</span><b class="pos" style="font-size:1.25rem">${GBP(a0.int-a1.int)}</b><small>${GBP(a0.int)} down to ${GBP(a1.int)}</small></div>
       <div class="kpi"><span>Cash it costs</span><b style="font-size:1.25rem">${GBP(sc.lump+sc.extra*12)}</b><small>in the first year</small></div></div>
       ${lineChart('c3',ser,{label:'Debt balance',years:true,series:[{k:'p',c:'var(--muted)',name:'Current plan',dash:1},{k:'s',c:'var(--debt)',name:'With extra'}]})}
       <div class="legend"><span><i style="border-color:var(--muted);border-top-style:dashed"></i>Current plan</span><span><i style="border-color:var(--debt)"></i>With the lump sum or extra payments</span></div>`}
    else debtHtml=`<div class="note" style="margin-top:12px">Add the balance and interest rate for ${esc(d.name)} on the Debts tab to see how much sooner it ends and how much interest you save.</div>`}
  return`<h2>What it does</h2><div class="compare" style="margin-top:10px"><div class="h"></div><div class="h n">Current plan</div><div class="h n">This scenario</div><div class="h n">Change</div>
   ${row('Left over each month',net(fm(P)),net(fm(X)))}${row('Bank at end of first month',fm(P).endBank,fm(X).endBank)}
   ${row('Savings after 6 months',at(P,182).sav,at(X,182).sav)}${row('Savings after 12 months',at(P,364).sav,at(X,364).sav)}
   ${row('Lowest bank balance',P.lowBank.v,X.lowBank.v)}${row('Card spend a year',P.cardSpend/P.nMonths*12,X.cardSpend/X.nMonths*12)}</div>
   ${lineChart('c2',X.days.slice(0,365),{label:'Scenario',buffer:sc.buffer,series:[{k:'bank',c:'var(--bank)',name:'Bank'},...(X.cardSpend>0?[{k:'tru',c:'var(--amex)',name:'After Amex owed',dash:1}]:[]),{k:'sav',c:'var(--save)',name:'Savings'}]})}
   <div class="legend"><span><i style="border-color:var(--bank)"></i>Bank</span>${X.cardSpend>0?'<span><i style="border-color:var(--amex);border-top-style:dashed"></i>Bank minus Amex owed</span>':''}<span><i style="border-color:var(--save)"></i>Savings</span></div>
   <div class="note" style="margin:12px 0">Amex ${verdictPill(X)} ${esc(X.why)}</div>${debtHtml}
   ${X.goals.length?`<h3 style="margin:16px 0 6px">Goals, holidays and tax</h3><div class="compare"><div class="h"></div><div class="h n">Current</div><div class="h n">Scenario</div><div class="h n"></div>${X.goals.filter(g=>g.target>0).map(g=>{const p0=P.goals.find(x=>x.id===g.id),f=x=>x.hit?fdate(x.hit):'not funded';return`<div>${esc(g.name)}</div><div class="n">${f(p0)}</div><div class="n">${f(g)}</div><div class="n">${g.status==='ok'?'<span class="pill good">on time</span>':'<span class="pill bad">late</span>'}</div>`}).join('')}</div>`:''}`}

/* ============ AMEX ============ */

   <div class="panel c4"><h2>Safety check</h2><p style="margin:0 0 8px">${verdictPill(S)}</p><p class="ink2" style="margin-top:0">${esc(S.why)}</p>
    <div class="note"><b>The rule:</b> money in the bank that you owe Amex is not yours to spend. The dashed line on the Today chart is your bank balance minus what you owe Amex. Keep it above your buffer and the card cannot put you in debt.</div>
    <div class="list" style="margin-top:10px"><div class="item"><span>Put on Amex</span><b>${plan.amexShare}% of card-friendly spend</b></div><div class="item"><span>Card spend per year</span><b>${GBP(yr)}</b></div>
     <div class="item"><span>Average days to pay</span><b>${S.float||'–'}</b></div><div class="item"><span>Avios per year</span><b>${Math.round(pts).toLocaleString('en-GB')}</b></div>

    <p class="small muted">A purchase the day after a statement closes waits about 30 days for the statement and 25 more to pay. That gap is the cashflow benefit.</p></div>
   <div class="panel c12"><h2>Card settings</h2><div class="row" style="gap:22px">

    <label>Points per £1 ${F('amex.rate','num',A.rate,'step="0.1" style="width:64px"')}</label><label>1 Avios is worth (pence) ${F('amex.pv','num',A.pv,'step="0.1" style="width:64px"')}</label>
    <label>Balance owed now £ ${F('amex.owed','num',A.owed,'style="width:90px"')}</label><label>Safety buffer £ ${F('buffer','num',plan.buffer,'style="width:90px"')}</label></div>
    <p class="small muted">Your example: spend 6 Aug to 5 Sep was due on 30 Sep, which is 25 days after the statement closed, so 25 is the default.</p></div></div>`}

   <div class="panel c12"><b>Monthly overview</b> <span class="num">In ${GBP2(totI)} · Bills ${GBP2(totB)} · Debts ${GBP2(totD)} · Spending ${GBP2(totV)} · Savings ${GBP2(plan.savings.monthly)} → <b class="${totI-totB-totD-totV-plan.savings.monthly<0?'neg':'pos'}">${GBP2(totI-totB-totD-totV-plan.savings.monthly)}</b> left</span></div></div>`}

/* ============ render + events ============ */
const TABS=[['today','Today',vToday],['daily','Day to day',vDaily],['where','Where it goes',vWhere],['debts','Debts',vDebts],['goals','Goals and holidays',vGoals],['tax','Tax',vTax],['whatif','What if',vWhatIf],['amex','Amex',vAmex],['setup','Setup',vSetup]];
function render(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('');$('#main').innerHTML=TABS.find(x=>x[0]===tab)[2]()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.go){tab=b.dataset.go;render();return}
  const a=b.dataset.act;if(!a)return;
  if(a==='win'){view.win=+b.dataset.w;render()}
  if(a==='setbal'){const v=parseFloat($('#quickBal').value);if(!isNaN(v))mutate(p=>{p.bank=v;p.asOf=todayISO()})}
  if(a==='reset'){scenarioInit();render()}
  if(a==='commit'){mutate(p=>{p.income.forEach(i=>i.amount=sc.inc[i.id]);p.vars.forEach(v=>v.budget=sc.vars[v.id]);p.tax.forEach(t=>t.adj=sc.tax[t.id]);p.savings.monthly=sc.sav;p.amexShare=sc.share;p.buffer=sc.buffer;
    const d=p.debts.find(x=>x.id===sc.debtSel);if(d){d.extra=(d.extra||0)+sc.extra;if(sc.lump>0)p.lumps.push({id:uid(),debt:d.id,amount:sc.lump,date:sc.lumpDate,from:sc.lumpFrom})}});tab='today';render()}
  if(a==='del')mutate(p=>p[b.dataset.list].splice(+b.dataset.i,1));
  if(a==='add'){const l=b.dataset.list;mutate(p=>{const id=l[0]+'_'+uid();
    if(l==='income')p.income.push({id,name:'New income',amount:0,day:28});
    if(l==='bills')p.bills.push({id,name:'New bill',amount:0,day:1,kind:'need',card:false,fee:0});
    if(l==='debts')p.debts.push({id,name:'New debt',type:'loan',balance:null,start:null,apr:null,pay:0,day:1,extra:0});
    if(l==='vars')p.vars.push({id,name:'New category',budget:0,kind:'want',cardOK:true});
    if(l==='oneoffs')p.oneoffs.push({id,name:'New expense',amount:0,date:addDays(todayISO(),30),pay:'bank'});
    if(l==='tax')p.tax.push({id,name:'New tax bill',last:0,adj:100,date:addDays(todayISO(),180),saved:0});
    if(l==='goals')p.goals.push({id,name:'New holiday or goal',kind:'holiday',target:1000,saved:0,date:addDays(todayISO(),180),monthly:0,spend:true,amex:false})})}
  if(a==='mprev'||a==='mnext'){const[y,m]=view.m.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+(a==='mnext'?1:-1),1));view.m=d.toISOString().slice(0,7);render()}
  if(a==='addtx'){const d=$('#e_date').value,amt=parseFloat($('#e_amt').value),c=$('#e_cat').value;if(!d||!(amt>0)||!c){$('#e_amt').focus();return}
    const k=d.slice(0,7);(txMonths[k]=txMonths[k]||[]).push({id:'m_'+uid(),d,t:$('#e_note').value.trim(),a:-amt,c,s:'man',p:$('#e_pay').value});saveTx(k);view.m=k;render()}
  if(a==='deltx'){const k=b.dataset.m;txMonths[k]=(txMonths[k]||[]).filter(t=>t.id!==b.dataset.id);saveTx(k);render()}
  if(a==='trycut'){scenarioInit();plan.vars.forEach(v=>{if(v.kind==='want')sc.vars[v.id]=Math.round(v.budget*(1-view.cut/100))});tab='whatif';render()}
  if(a==='testdebt'){scenarioInit();sc.debtSel=b.dataset.id;tab='whatif';render()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.p){const t=el.dataset.t;let v;if(t==='bool')v=el.checked;else if(t==='num')v=el.value===''?(el.dataset.nul?null:0):parseFloat(el.value);else v=el.value;mutate(p=>setPath(el.dataset.p,v));return}
  if(el.dataset.cat){const m=el.dataset.m,c=el.value,t=(txMonths[m]||[]).find(x=>x.id===el.dataset.cat);if(!t)return;
    const kw=(t.t||'').toUpperCase().split(' ').filter(w=>w.length>2&&!/^\d+$/.test(w)).slice(0,2).join(' ');
    if(c&&kw&&t.s!=='man')txMonths[m].forEach(x=>{if(!x.c&&x.s!=='man'&&x.t.toUpperCase().includes(kw))x.c=c});t.c=c;
    if(c&&kw&&t.s!=='man'&&!plan.rules.find(r=>r.k===kw)){plan.rules.push({k:kw,c});persist()}
    await saveTx(m);render();return}
  if(el.id==='impFile'&&el.files[0]){$('#impMsg').textContent='Reading…';try{const msg=await importFile(el.files[0],$('#impSrc').value);const m=$('#impMsg');if(m)m.textContent=msg}catch(err){const m=$('#impMsg');if(m)m.textContent='Could not read that file: '+err.message}}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.out){const o=document.getElementById(el.dataset.out);if(o)o.textContent=pct(+el.value);return}
  const id=el.dataset.sl;if(!id)return;
  if(id==='cut'){view.cut=+el.value;$('#o_cut').textContent=pct(view.cut);const S=sim(plan);$('#cutRes').innerHTML=cutResult(S,monthlyLines(S).L.filter(x=>x.k==='want').reduce((a,x)=>a+x.v,0));return}
  if(!sc)return;const v=el.value;
  if(id==='debtSel'||id==='lumpDate'||id==='lumpFrom'){sc[id]=v}
  else{const n=+v;if(id.startsWith('inc_'))sc.inc[id.slice(4)]=n;else if(id.startsWith('var_'))sc.vars[id.slice(4)]=n;else if(id.startsWith('tax_'))sc.tax[id.slice(4)]=n;else sc[id]=n;
    const o=$('#o_'+id);if(o)o.textContent=id==='share'||id.startsWith('tax_')?pct(n):GBP(n)}
  cancelAnimationFrame(view.raf);view.raf=requestAnimationFrame(()=>{const r=$('#scRes');if(r)r.innerHTML=scResults()});
});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});

/* ============ boot ============ */
render();
(async function(){
  const localLoaded=loadLocal();if(localLoaded){render();setSync('Loaded from this device','')}
  let db=null,user=null;try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  if(!db){setSync('Saved on this device only','bad');return}
  dbh=db;try{me=user&&await user.id()}catch(e){}
  db.doc('hh/plan').onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();if(d.at&&d.at===lastAt){setSync('Saved · shared with Annie','ok');return}
      try{const o=JSON.parse(d.json);if(o&&o.v===2){plan=o;sc=null;saveLocal();const ae=document.activeElement;if(!ae||!/INPUT|SELECT/.test(ae.tagName)||ae.type==='range')render();setSync('Synced with Annie','ok')}}catch(e){}}
    else{setSync('Ready. Your first change will be saved and shared','ok');if(localLoaded)persist()}
  },err=>setSync('Not synced ('+(err&&err.code||'error')+')','bad'));
  db.collection('tx').onSnapshot(snap=>{snap.docs.forEach(d=>{try{txMonths[d.id]=JSON.parse(d.data().json)}catch(e){}});if(tab==='daily')render()},()=>{});
})();
</script>
